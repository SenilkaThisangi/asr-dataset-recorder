services:
  - type: web
    name: asr-recording-collector
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SHEET_ID
        sync: false
      - key: SHEET_TAB_NAME
        value: Sheet1
      - key: DRIVE_PARENT_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: COL_UTTERANCE_ID
        value: utterence_id
      - key: COL_USER
        value: speaker
      - key: COL_UTTERANCE_TEXT
        value: utterence
      - key: COL_STATUS
        value: status
      - key: COL_DRIVE_FILE_LINK
        value: audio
