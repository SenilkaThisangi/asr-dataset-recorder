services:
  - type: web
    name: asr-recording-collector
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SHEET_ID
        sync: false
      - key: SHEET_TAB_NAME
        value: Sheet1
      - key: DRIVE_PARENT_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
